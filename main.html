<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeQuest: Учительская панель управления</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; background-color: #090d16; color: #f8fafc; }
        .glass-panel { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-6 space-y-6">

    <!-- HEADER -->
    <header class="glass-panel p-4 rounded-2xl flex flex-wrap items-center justify-between gap-4 border border-cyan-500/20">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-cyan-600 flex items-center justify-center text-xl text-white shadow-lg shadow-cyan-500/30">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <div>
                <h1 class="text-xl font-extrabold text-white">Панель Преподавателя</h1>
                <p class="text-xs text-slate-400">Мониторинг прогресса и управление учениками</p>
            </div>
        </div>
        <button id="add-student-btn" class="px-4 py-2 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white text-sm font-bold transition flex items-center gap-2">
            <i class="fa-solid fa-user-plus"></i> Добавить Ученика
        </button>
    </header>

    <!-- STUDENTS TABLE -->
    <main class="glass-panel rounded-2xl p-6 border border-slate-800 space-y-4">
        <h2 class="text-lg font-bold text-slate-200 flex items-center gap-2">
            <i class="fa-solid fa-users text-cyan-400"></i> Список Учеников и Прогресс
        </h2>
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm border-collapse">
                <thead>
                    <tr class="border-b border-slate-800 text-slate-400 text-xs uppercase tracking-wider">
                        <th class="p-3">Ученик</th>
                        <th class="p-3">Логин</th>
                        <th class="p-3">Статус</th>
                        <th class="p-3">Звёзды</th>
                        <th class="p-3">Пройдено</th>
                        <th class="p-3">Доступные Модули</th>
                        <th class="p-3 text-right">Действия</th>
                    </tr>
                </thead>
                <tbody id="students-table-body" class="divide-y divide-slate-800/50">
                    <!-- Заполняется динамически -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- ADD/EDIT MODAL -->
    <div id="student-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-panel max-w-md w-full p-6 rounded-3xl border border-cyan-500/30 space-y-4">
            <h3 id="modal-title" class="text-lg font-bold text-white">Добавить Ученика</h3>
            <form id="student-form" class="space-y-3">
                <input type="hidden" id="student-id">
                <div>
                    <label class="text-xs font-bold text-slate-400">Имя и Фамилия</label>
                    <input id="student-name" type="text" required class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-400">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-400">Логин</label>
                    <input id="student-login" type="text" required class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-400">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-400">Пароль</label>
                    <input id="student-password" type="text" required class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-400">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-400">Разрешенные Модули (от 1 до 30)</label>
                    <input id="student-allowed-modules" type="number" min="1" max="30" value="1" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-400">
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="button" id="modal-close-btn" class="flex-1 py-2 rounded-xl bg-slate-800 text-sm font-bold">Отмена</button>
                    <button type="submit" class="flex-1 py-2 rounded-xl bg-cyan-600 text-sm font-bold text-white">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://hlvlcrkdmlfgynwahqwi.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_4BrlFeyAjXbhRrq_ID0V-w_iiLzkNsQ';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadStudents() {
            const { data: students, error } = await supabaseClient.from('game_saves').select('*').order('created_at', { ascending: true });
            if (error) return console.error(error);

            const tbody = document.getElementById('students-table-body');
            tbody.innerHTML = '';

            students.forEach(s => {
                const saveData = s.save_data || {};
                const stars = Object.values(saveData.stars || {}).reduce((a, b) => a + b, 0);
                const levelsCount = Object.keys(saveData.stars || {}).length;

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-800/30 transition';
                tr.innerHTML = `
                    <td class="p-3 font-bold text-white">${s.student_name || 'Без имени'}</td>
                    <td class="p-3 text-slate-400">${s.login}</td>
                    <td class="p-3">
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold ${s.is_disabled ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'}">
                            ${s.is_disabled ? 'Заблокирован' : 'Активен'}
                        </span>
                    </td>
                    <td class="p-3 font-bold text-amber-400"><i class="fa-solid fa-star mr-1"></i>${stars}</td>
                    <td class="p-3 text-cyan-400 font-bold">${levelsCount} ур.</td>
                    <td class="p-3 font-bold text-indigo-400">Модули 1–${s.allowed_modules || 1}</td>
                    <td class="p-3 text-right space-x-2">
                        <button onclick="toggleDisable('${s.id}', ${!s.is_disabled})" class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-bold ${s.is_disabled ? 'text-emerald-400' : 'text-rose-400'}" title="${s.is_disabled ? 'Включить' : 'Отключить'}">
                            <i class="fa-solid ${s.is_disabled ? 'fa-user-check' : 'fa-user-slash'}"></i>
                        </button>
                        <button onclick="editStudent('${s.id}', '${s.student_name}', '${s.login}', '${s.password}', ${s.allowed_modules || 1})" class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-cyan-400 text-xs font-bold">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function toggleDisable(id, status) {
            await supabaseClient.from('game_saves').update({ is_disabled: status }).eq('id', id);
            loadStudents();
        }

        document.getElementById('student-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('student-id').value;
            const payload = {
                student_name: document.getElementById('student-name').value,
                login: document.getElementById('student-login').value.toLowerCase().trim(),
                password: document.getElementById('student-password').value,
                allowed_modules: parseInt(document.getElementById('student-allowed-modules').value) || 1
            };

            if (id) {
                await supabaseClient.from('game_saves').update(payload).eq('id', id);
            } else {
                await supabaseClient.from('game_saves').insert([payload]);
            }
            document.getElementById('student-modal').classList.add('hidden');
            loadStudents();
        });

        function editStudent(id, name, login, pass, allowed) {
            document.getElementById('student-id').value = id;
            document.getElementById('student-name').value = name;
            document.getElementById('student-login').value = login;
            document.getElementById('student-password').value = pass;
            document.getElementById('student-allowed-modules').value = allowed;
            document.getElementById('modal-title').textContent = 'Редактировать Ученика';
            document.getElementById('student-modal').classList.remove('hidden');
        }

        document.getElementById('add-student-btn').addEventListener('click', () => {
            document.getElementById('student-form').reset();
            document.getElementById('student-id').value = '';
            document.getElementById('modal-title').textContent = 'Добавить Ученика';
            document.getElementById('student-modal').classList.remove('hidden');
        });

        document.getElementById('modal-close-btn').addEventListener('click', () => {
            document.getElementById('student-modal').classList.add('hidden');
        });

        loadStudents();
    </script>
</body>
</html>
